[project]
name = "porchsite-server"
version = "0.1.0"
description = "Porchsite, server edition: a website your AI assistant keeps up to date, with nothing live without the owner's yes"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "mcp>=1.20.0",
    "markdown-it-py>=3.0.0",
    "ada-url==4.0.0",
    "pystache==0.6.8",
    "webauthn>=2.7.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.setuptools.package-data]
"server.app" = ["schema.sql", "field_guide.json", "beacon.js", "agent-traffic.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["server"]
